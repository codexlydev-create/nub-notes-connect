<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <title>Note Share — NUB Student Notes Platform</title>
    <meta name="description" content="Share and discover academic notes and slides at Northern University Bangladesh. Search by department, course, and code." />
    <meta name="author" content="Note Share" />

    <meta property="og:title" content="Note Share — NUB Student Notes Platform" />
    <meta property="og:description" content="Share and discover academic notes and slides at Northern University Bangladesh." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    <style>
      /* Theme-matched pre-hydration background to prevent white/black flash */
      html, body { margin: 0; padding: 0; background: #f7f6fc; }
      html.dark, html.dark body { background: #11111c; }
      #initial-loader {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 18px; z-index: 9999;
        background: radial-gradient(ellipse at top, #ece6ff 0%, #f7f6fc 60%);
        transition: opacity .45s ease;
      }
      html.dark #initial-loader {
        background: radial-gradient(ellipse at top, #1c1530 0%, #11111c 60%);
      }
      #initial-loader.fade-out { opacity: 0; pointer-events: none; }
      .il-logo {
        width: 72px; height: 72px; border-radius: 18px; object-fit: cover;
        box-shadow: 0 20px 60px -20px rgba(120, 80, 255, 0.45);
        animation: il-pulse 1.6s ease-in-out infinite;
      }
      .il-ring {
        width: 110px; height: 110px; border-radius: 50%;
        border: 3px solid rgba(140, 100, 255, 0.18);
        border-top-color: #7c5cff;
        position: absolute;
        animation: il-spin 1s linear infinite;
      }
      .il-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase;
        color: #6b6890; font-weight: 600;
      }
      html.dark .il-text { color: #a9a4cf; }
      @keyframes il-spin { to { transform: rotate(360deg); } }
      @keyframes il-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.92); opacity: 0.85; }
      }
    </style>
    <script>
      // Apply theme class before paint to avoid a flash of the wrong theme
      (function () {
        try {
          var t = localStorage.getItem("ns_theme");
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <div id="initial-loader" aria-hidden="true">
      <div style="position:relative; display:flex; align-items:center; justify-content:center; width:110px; height:110px;">
        <div class="il-ring"></div>
        <img src="/favicon.png" alt="" class="il-logo" />
      </div>
      <div class="il-text">Note Share</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
